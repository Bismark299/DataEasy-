<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataEasy+ - Login</title>
    <!-- Critical: Prevent FOUC -->
    <style>html{visibility:hidden;opacity:0;}</style>
    <link rel="stylesheet" href="../assets/css/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css?v=20260213c">
    <script src="../assets/js/config.js"></script>
    <style>
        html{visibility:visible;opacity:1;}
    </style>
</head>
<body class="bg-dark-bg min-h-screen flex flex-col">
    <!-- Header Navigation -->
    <header class="bg-card-bg py-3 sticky top-0 z-30">
        <div class="max-w-[1200px] mx-auto px-4 md:px-6 flex items-center justify-center">
            <a href="#" class="flex items-center gap-2">
                <i class="fas fa-bolt text-mtn-yellow text-xl"></i>
                <span class="text-white font-bold text-lg">DataEasy+</span>
                <span class="text-gray-400 text-xs hidden sm:inline">data portal</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md md:max-w-lg">
            <!-- Login Card -->
            <div class="bg-card-bg rounded-2xl border border-gray-700 shadow-xl">
                <div class="p-6 md:p-8 lg:p-10">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4">
                        <i class="fas fa-user text-white text-2xl"></i>
                    </div>
                    <h1 class="text-white text-2xl font-bold mb-2">Welcome Back</h1>
                    <p class="text-gray-400 text-sm">Sign in to your account to continue</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <!-- Email/Phone -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Email or Phone Number</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="text" name="emailOrPhone" placeholder="Enter your email or phone" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-4 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" id="password" placeholder="Enter your password" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-12 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                            <button type="button" id="toggle-password" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="rememberMe" class="w-4 h-4 md:w-5 md:h-5 rounded border-gray-600 bg-gray-800 text-blue-600 focus:ring-blue-500 focus:ring-offset-0">
                            <span class="text-gray-400 text-sm md:text-base">Remember me</span>
                        </label>
                        <a href="#" class="text-blue-400 hover:text-blue-300 text-sm md:text-base transition">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 md:py-4 rounded-lg transition flex items-center justify-center gap-2 text-base md:text-lg">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <!-- Sign Up Link -->
                <p class="text-center text-gray-400 text-sm mt-6">
                    Don't have an account? 
                    <a href="register" class="text-blue-400 hover:text-blue-300 font-medium transition">Create one</a>
                </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-card-bg py-4 border-t border-gray-700">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">&copy; 2026 DataEasy+. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toggleBtn = document.getElementById('toggle-password');
            if (toggleBtn) {
                toggleBtn.addEventListener('click', function() {
                    var passwordInput = document.getElementById('password');
                    var toggleIcon = document.getElementById('toggleIcon');
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        toggleIcon.classList.remove('fa-eye');
                        toggleIcon.classList.add('fa-eye-slash');
                    } else {
                        passwordInput.type = 'password';
                        toggleIcon.classList.remove('fa-eye-slash');
                        toggleIcon.classList.add('fa-eye');
                    }
                });
            }
        });
    </script>
    
    <!-- JavaScript Modules -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
