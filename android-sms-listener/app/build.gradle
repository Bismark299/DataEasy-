plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.dataeasy.smslistener'
    compileSdk 34

    defaultConfig {
        applicationId "com.dataeasy.smslistener"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // DataEasy+ MoMo Listener Configuration
        buildConfigField "String", "API_BASE_URL", '"https://dataeasy.onrender.com"'
        buildConfigField "String", "API_SECRET_TOKEN", '"dE4sy_m0m0_L1st3n3r_S3cr3t_T0k3n_2026_GH"'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    lint {
        abortOnError false
    }
    
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Retrofit for API calls
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Room for SQLite offline queue (using KSP)
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    // WorkManager for retry logic
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
}
