<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>HSTN Lookup — Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; }

        :root {
            --mtn:         #FFCB05;
            --mtn-dark:    #e6b800;
            --mtn-light:   #FFD740;
            --mtn-glow:    rgba(255,203,5,0.18);
            --mtn-glow-sm: rgba(255,203,5,0.10);
            --bg:          #0b0b0d;
            --surface:     #141416;
            --surface-2:   #1c1c1f;
            --surface-3:   #242428;
            --border:      #2a2a2f;
            --border-mtn:  rgba(255,203,5,0.25);
            --text:        #f0f0f2;
            --text-muted:  #9090a0;
            --text-dim:    #55555f;
            --red:         #ef4444;
            --red-bg:      rgba(239,68,68,0.12);
            --radius:      14px;
            --radius-sm:   9px;
            --shadow:      0 8px 32px rgba(0,0,0,0.45);
            --shadow-mtn:  0 4px 20px rgba(255,203,5,0.22);
            --transition:  0.2s cubic-bezier(0.4,0,0.2,1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .top-stripe {
            height: 3px;
            background: linear-gradient(90deg, #FFCB05 0%, #FFD740 40%, #e6b800 100%);
            flex-shrink: 0;
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 28px;
            display: flex;
            align-items: center;
            height: 64px;
            flex-shrink: 0;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-badge {
            width: 42px; height: 42px;
            background: var(--mtn);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-mtn);
            flex-shrink: 0;
            position: relative; overflow: hidden;
        }
        .brand-badge::after {
            content: ''; position: absolute;
            top: -6px; right: -6px;
            width: 22px; height: 22px;
            background: rgba(255,255,255,0.22); border-radius: 50%;
        }
        .brand-badge i { font-size: 17px; color: #000; z-index: 1; }
        .brand-text .name    { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.2; }
        .brand-text .tagline { font-size: 11px; color: var(--text-dim); margin-top: 1px; }

        .stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 380px;
            padding: 36px 32px 32px;
            box-shadow: var(--shadow);
        }

        .card-header { text-align: center; margin-bottom: 28px; }
        .lock-icon {
            width: 56px; height: 56px;
            background: var(--mtn-glow);
            border: 1px solid var(--border-mtn);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--mtn);
            margin-bottom: 16px;
        }
        .card-title { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
        .card-sub   { font-size: 13px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }

        .field { margin-bottom: 20px; }
        .field label {
            display: block; font-size: 11px; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
            margin-bottom: 7px;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
            font-size: 13px; color: var(--text-dim); pointer-events: none;
        }
        .field input {
            width: 100%;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 42px 12px 38px;
            color: var(--text); font-size: 14px; font-family: inherit;
            transition: var(--transition); outline: none;
        }
        .field input:focus {
            border-color: var(--mtn);
            box-shadow: 0 0 0 3px var(--mtn-glow);
        }
        .field input::placeholder { color: var(--text-dim); }

        .toggle-pw {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--text-dim); font-size: 13px; padding: 2px 4px;
            transition: color var(--transition);
        }
        .toggle-pw:hover { color: var(--text-muted); }

        .error-box {
            background: var(--red-bg); border: 1px solid rgba(239,68,68,0.22);
            border-radius: var(--radius-sm); padding: 11px 14px;
            font-size: 13px; color: var(--red);
            display: none; align-items: center; gap: 9px;
            margin-bottom: 16px;
        }
        .error-box.show { display: flex; }

        .btn {
            width: 100%; padding: 13px;
            border-radius: var(--radius-sm); border: none;
            font-size: 14px; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--mtn); color: #000;
            box-shadow: var(--shadow-mtn);
        }
        .btn:hover:not(:disabled) { background: var(--mtn-light); box-shadow: 0 6px 24px rgba(255,203,5,0.40); transform: translateY(-1px); }
        .btn:active:not(:disabled) { transform: translateY(0); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }

        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        footer {
            text-align: center; padding: 20px;
            font-size: 11px; color: var(--text-dim);
            border-top: 1px solid var(--border); flex-shrink: 0;
        }
        footer span { color: var(--mtn); font-weight: 600; }
    </style>
</head>
<body>
    <div class="top-stripe"></div>

    <nav class="navbar">
        <div class="brand">
            <div class="brand-badge"><i class="fas fa-bolt"></i></div>
            <div class="brand-text">
                <div class="name">HSTN Lookup</div>
                <div class="tagline">Allocation Intelligence</div>
            </div>
        </div>
    </nav>

    <div class="stage">
        <div class="card">
            <div class="card-header">
                <div class="lock-icon"><i class="fas fa-shield-halved"></i></div>
                <div class="card-title">Access Required</div>
                <div class="card-sub">Enter the access password to continue.</div>
            </div>

            <div class="error-box" id="err-box"><i class="fas fa-circle-exclamation"></i> <span id="err-msg"></span></div>

            <form onsubmit="doLogin(); return false;" autocomplete="on">
                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" autofocus>
                        <button class="toggle-pw" type="button" onclick="togglePw()" tabindex="-1"><i class="fas fa-eye" id="eye-icon"></i></button>
                    </div>
                </div>
                <button class="btn" id="submit-btn" type="submit">
                    <span class="spinner" id="spinner"></span>
                    <span id="btn-label"><i class="fas fa-arrow-right-to-bracket"></i> Enter</span>
                </button>
            </form>
        </div>
    </div>

    <footer>Powered by <span>DataEasy+</span></footer>

    <script>
        (function() {
            const token = localStorage.getItem('lookup_token');
            if (!token) return;
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (payload.exp * 1000 > Date.now() && payload.type === 'lookup' && payload.v === 2) {
                    window.location.replace('/hstn-lookup');
                }
            } catch (_) {}
        })();

        function togglePw() {
            const input = document.getElementById('password');
            const icon  = document.getElementById('eye-icon');
            const isText = input.type === 'text';
            input.type  = isText ? 'password' : 'text';
            icon.className = isText ? 'fas fa-eye' : 'fas fa-eye-slash';
        }

        function setLoading(on) {
            const btn = document.getElementById('submit-btn');
            btn.disabled = on;
            document.getElementById('spinner').style.display   = on ? 'block' : 'none';
            document.getElementById('btn-label').style.opacity = on ? '0'     : '1';
        }

        function showError(msg) {
            document.getElementById('err-msg').textContent = msg;
            document.getElementById('err-box').classList.add('show');
        }

        async function doLogin() {
            document.getElementById('err-box').classList.remove('show');
            const password = document.getElementById('password').value;
            if (!password) { showError('Please enter the password.'); return; }

            setLoading(true);
            try {
                const resp = await fetch('/api/lookup/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await resp.json();
                if (!data.success) { showError(data.error || 'Incorrect password.'); return; }
                localStorage.setItem('lookup_token', data.token);
                window.location.replace('/hstn-lookup');
            } catch (e) {
                showError('Network error — please try again.');
            } finally {
                setLoading(false);
            }
        }
    </script>
</body>
</html>
