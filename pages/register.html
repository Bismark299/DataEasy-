<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataEasy+ - Create Account</title>
    <!-- Critical: Prevent FOUC -->
    <style>html{visibility:hidden;opacity:0;}</style>
    <link rel="stylesheet" href="../assets/css/tailwind.min.css" onload="document.documentElement.style.visibility='visible';document.documentElement.style.opacity='1';">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css?v=20260213c">
    <script src="../assets/js/config.js"></script>
</head>
<body class="bg-dark-bg min-h-screen flex flex-col">
    <!-- Header Navigation -->
    <header class="bg-card-bg py-3 sticky top-0 z-30">
        <div class="max-w-[1200px] mx-auto px-4 md:px-6 flex items-center justify-center">
            <a href="#" class="flex items-center gap-2">
                <i class="fas fa-bolt text-mtn-yellow text-xl"></i>
                <span class="text-white font-bold text-lg">DataEasy+</span>
                <span class="text-gray-400 text-xs hidden sm:inline">data portal</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md md:max-w-lg lg:max-w-xl">
            <!-- Register Card -->
            <div class="bg-card-bg rounded-2xl border border-gray-700 relative z-10">
                <div class="p-6 md:p-8 lg:p-10">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-green-600 to-emerald-600 rounded-full mb-4">
                        <i class="fas fa-user-plus text-white text-2xl"></i>
                    </div>
                    <h1 class="text-white text-2xl font-bold mb-2">Create Account</h1>
                    <p class="text-gray-400 text-sm">Join DataEasy+ and start selling data</p>
                </div>

                <!-- Register Form -->
                <form id="register-form" class="space-y-4">
                    <!-- Full Name -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Full Name</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" name="fullName" placeholder="Enter your full name" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-4 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Email Address</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" name="email" placeholder="Enter your email" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-4 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Phone Number</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-phone"></i>
                            </span>
                            <input type="tel" name="phone" id="phone-input" placeholder="Enter your phone number" maxlength="10" pattern="[0-9]*" inputmode="numeric" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-4 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" id="password" placeholder="Create a password" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-12 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                            <button type="button" id="toggle-password-1" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                                <i class="fas fa-eye" id="toggleIcon1"></i>
                            </button>
                        </div>
                        <div class="mt-2">
                            <div class="h-1 bg-gray-700 rounded-full overflow-hidden">
                                <div id="password-strength-bar" class="h-full rounded-full transition-all bg-gray-600" style="width: 0%"></div>
                            </div>
                            <p id="password-strength-text" class="text-xs text-gray-500 mt-1">Password strength</p>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div>
                        <label class="text-gray-400 text-sm md:text-base mb-2 block">Confirm Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password" class="w-full bg-gray-800 text-white py-3 md:py-4 pl-12 pr-12 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm md:text-base" required>
                            <button type="button" id="toggle-password-2" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                                <i class="fas fa-eye" id="toggleIcon2"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms & Conditions -->
                    <div class="flex items-start gap-2">
                        <input type="checkbox" name="acceptTerms" id="terms" class="w-4 h-4 md:w-5 md:h-5 mt-0.5 rounded border-gray-600 bg-gray-800 text-blue-600 focus:ring-blue-500 focus:ring-offset-0" required>
                        <label for="terms" class="text-gray-400 text-sm md:text-base cursor-pointer">
                            I agree to the <a href="#" class="text-blue-400 hover:text-blue-300">Terms of Service</a> and <a href="#" class="text-blue-400 hover:text-blue-300">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Register Button -->
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 md:py-4 rounded-lg transition flex items-center justify-center gap-2 mt-2 text-base md:text-lg">
                        <i class="fas fa-user-plus"></i>
                        Create Account
                    </button>
                </form>

                <!-- Login Link -->
                <p class="text-center text-gray-400 text-sm mt-6">
                    Already have an account? 
                    <a href="login" class="text-blue-400 hover:text-blue-300 font-medium transition">Sign in</a>
                </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-card-bg py-4 border-t border-gray-700">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">&copy; 2026 DataEasy+. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Phone input - numbers only
            var phoneInput = document.getElementById('phone-input');
            if (phoneInput) {
                phoneInput.addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            }
            
            // Password toggle functions
            function togglePassword(inputId, iconId) {
                var passwordInput = document.getElementById(inputId);
                var toggleIcon = document.getElementById(iconId);
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            }
            
            var toggle1 = document.getElementById('toggle-password-1');
            var toggle2 = document.getElementById('toggle-password-2');
            if (toggle1) toggle1.addEventListener('click', function() { togglePassword('password', 'toggleIcon1'); });
            if (toggle2) toggle2.addEventListener('click', function() { togglePassword('confirmPassword', 'toggleIcon2'); });
        });
    </script>
    
    <!-- JavaScript Modules -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
