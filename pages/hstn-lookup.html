<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Allocation Lookup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface-2: #232733;
            --surface-3: #2a2e3b;
            --border: #2e3348;
            --border-hover: #3d4260;
            --text: #e4e5ea;
            --text-muted: #8b8fa3;
            --text-dim: #5c6078;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --accent-glow: rgba(245, 158, 11, 0.15);
            --green: #22c55e;
            --green-bg: rgba(34, 197, 94, 0.12);
            --red: #ef4444;
            --red-bg: rgba(239, 68, 68, 0.12);
            --blue: #3b82f6;
            --blue-bg: rgba(59, 130, 246, 0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="light"] {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-2: #f0f1f5;
            --surface-3: #e4e6ed;
            --border: #d5d8e0;
            --border-hover: #b8bcc8;
            --text: #1a1d27;
            --text-muted: #555a6e;
            --text-dim: #8b8fa3;
            --accent: #d97706;
            --accent-hover: #b45309;
            --accent-glow: rgba(217, 119, 6, 0.10);
            --green: #16a34a;
            --green-bg: rgba(22, 163, 74, 0.10);
            --red: #dc2626;
            --red-bg: rgba(220, 38, 38, 0.10);
            --blue: #2563eb;
            --blue-bg: rgba(37, 99, 235, 0.10);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

        /* Header */
        .header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .logo-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--accent), #f97316);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: #000;
            box-shadow: 0 2px 12px rgba(245, 158, 11, 0.3);
        }
        .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
        .header p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
        .header-badge {
            font-size: 11px; padding: 4px 10px; border-radius: 20px;
            background: var(--accent-glow); color: var(--accent); font-weight: 500;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        /* Tabs */
        .tabs {
            display: flex; gap: 4px; background: var(--surface);
            border-radius: var(--radius); padding: 4px;
            margin-bottom: 24px; border: 1px solid var(--border); width: fit-content;
        }
        .tab {
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 500; cursor: pointer;
            border: none; background: transparent; color: var(--text-muted);
            transition: var(--transition); display: flex; align-items: center; gap: 8px;
        }
        .tab:hover { color: var(--text); background: var(--surface-2); }
        .tab.active {
            background: var(--accent); color: #000; font-weight: 600;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }
        .tab i { font-size: 12px; }

        /* Cards */
        .card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 24px; margin-bottom: 20px;
            transition: var(--transition);
        }
        .card:hover { border-color: var(--border-hover); }

        /* Form */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label {
            font-size: 12px; font-weight: 500; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group textarea {
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 10px 14px;
            color: var(--text); font-size: 14px; font-family: inherit;
            transition: var(--transition); outline: none; min-width: 200px;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-dim); }
        .form-group input[type="date"] {
            color-scheme: dark; min-width: 150px;
        }
        [data-theme="light"] .form-group input[type="date"] { color-scheme: light; }
        .form-group textarea {
            font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px;
            resize: vertical; min-width: 100%;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 600; cursor: pointer;
            border: none; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #f97316); color: #000;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.25);
        }
        .btn-primary:hover { box-shadow: 0 4px 16px rgba(245, 158, 11, 0.4); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-outline {
            background: transparent; color: var(--accent);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .btn-outline:hover { background: var(--accent-glow); border-color: var(--accent); }
        .btn-danger {
            background: transparent; color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: var(--red-bg); border-color: var(--red); }

        /* Stats Grid */
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .stat {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px 18px;
            position: relative; overflow: hidden;
        }
        .stat::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 3px; height: 100%; border-radius: 0 3px 3px 0;
        }
        .stat.yellow::before { background: var(--accent); }
        .stat.green::before { background: var(--green); }
        .stat.blue::before { background: var(--blue); }
        .stat.red::before { background: var(--red); }
        .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .stat-value { font-size: 24px; font-weight: 700; }

        /* Table */
        .table-wrap {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 600;
            color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
            background: var(--surface-2); border-bottom: 1px solid var(--border);
        }
        tbody td {
            padding: 12px 16px; font-size: 13px; color: var(--text-muted);
            border-bottom: 1px solid rgba(46, 51, 72, 0.5); white-space: nowrap;
        }
        tbody tr { transition: var(--transition); }
        tbody tr:hover { background: var(--surface-2); }
        tbody tr:last-child td { border-bottom: none; }
        .cell-phone { color: var(--text); font-weight: 500; font-family: 'SF Mono', ui-monospace, monospace; font-size: 13px; }
        .cell-gb { color: var(--accent); font-weight: 600; }

        /* Badge */
        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
        }
        .badge-success { background: var(--green-bg); color: var(--green); }
        .badge-failed { background: var(--red-bg); color: var(--red); }
        .badge-pending { background: var(--blue-bg); color: var(--blue); }
        .badge i { font-size: 7px; }

        /* Spinner */
        .loading { display: flex; justify-content: center; padding: 48px 0; }
        .loader {
            width: 32px; height: 32px; border: 3px solid var(--surface-3);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty & Error states */
        .empty-state { text-align: center; padding: 48px 20px; color: var(--text-dim); }
        .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }
        .error-msg {
            background: var(--red-bg); border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-sm); padding: 14px 18px;
            color: var(--red); font-size: 13px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
        }

        /* Count badge */
        .count-badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 10px;
            font-size: 10px; font-weight: 600;
            background: var(--surface-3); color: var(--text-muted);
        }

        /* Progress bar */
        .progress-bar { margin-top: 12px; display: none; }
        .progress-bar .track {
            width: 100%; height: 4px; background: var(--surface-3);
            border-radius: 4px; overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%; background: linear-gradient(90deg, var(--accent), #f97316);
            border-radius: 4px; transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
        }
        .progress-bar .label { font-size: 11px; color: var(--text-dim); margin-top: 6px; }

        /* Mobile cards */
        .mobile-cards { display: none; }
        .mobile-card { padding: 16px; border-bottom: 1px solid var(--border); }
        .mobile-card:last-child { border-bottom: none; }
        .mobile-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0; font-size: 13px;
        }
        .mobile-row .mlabel { color: var(--text-dim); }
        .mobile-row .mvalue { color: var(--text); text-align: right; }

        /* Per-number cards */
        .num-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
        }
        .num-card.has-error { border-color: rgba(239, 68, 68, 0.3); }
        .num-title {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 18px; background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }
        .num-index {
            font-size: 13px; font-weight: 700; color: var(--accent);
            min-width: 24px;
        }
        .num-phone {
            font-family: 'SF Mono', ui-monospace, monospace;
            font-size: 15px; font-weight: 600; color: var(--text);
        }
        .num-count {
            margin-left: auto;
            font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600;
        }
        .num-count.ok { background: var(--green-bg); color: var(--green); }
        .num-count.none { background: var(--surface-3); color: var(--text-dim); }
        .num-count.err { background: var(--red-bg); color: var(--red); }
        .num-records { padding: 0; }
        .num-table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        .num-table thead th {
            text-align: left; padding: 10px 18px;
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-dim); font-weight: 600;
            background: var(--surface-2); border-bottom: 1px solid var(--border);
        }
        .num-table tbody td {
            padding: 10px 18px; color: var(--text); font-weight: 500;
            border-bottom: 1px solid rgba(46, 51, 72, 0.4);
        }
        .num-table tbody tr:last-child td { border-bottom: none; }
        .num-table .gb { color: var(--accent); font-weight: 600; }
        .num-empty { padding: 16px 18px; color: var(--text-dim); font-size: 13px; }
        .num-error { padding: 14px 18px; color: var(--red); font-size: 13px; display: flex; align-items: center; gap: 8px; }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 20px;
            font-size: 13px; color: var(--text); box-shadow: var(--shadow); z-index: 1000;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: var(--green); }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 16px; }
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .form-row { flex-direction: column; }
            .form-group input { min-width: 100%; }
            .form-group textarea { min-width: 100%; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .desktop-table { display: none; }
            .mobile-cards { display: block; }
            .tabs { width: 100%; }
            .tab { flex: 1; justify-content: center; padding: 10px 12px; }
            .num-title { padding: 12px 14px; gap: 8px; }
            .num-phone { font-size: 13px; }
            .num-index { font-size: 12px; min-width: 20px; }
            .num-records { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .num-table { min-width: 480px; }
            .num-table thead th { padding: 8px 12px; }
            .num-table tbody td { padding: 8px 12px; font-size: 12px; }
            .card { padding: 16px; }
            .stat { padding: 12px 14px; }
            .stat-value { font-size: 20px; }
            .btn { padding: 10px 16px; font-size: 12px; }
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .header h1 { font-size: 17px; }
            .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
            .num-title { flex-wrap: wrap; }
            .num-count { margin-left: 0; margin-top: 4px; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.3s ease forwards; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon"><i class="fas fa-search" style="font-size:16px"></i></div>
                <div>
                    <h1>Allocation Lookup</h1>
                    <p>Search allocation records instantly</p>
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:10px;">
                <span class="header-badge"><i class="fas fa-lock" style="font-size:9px; margin-right:4px;"></i> Secure Proxy</span>
                <button id="theme-toggle" class="btn btn-outline" onclick="toggleTheme()" style="padding:8px 14px; font-size:14px;" title="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button id="tab-single" class="tab active" onclick="switchTab('single')">
                <i class="fas fa-search"></i> Single Search
            </button>
            <button id="tab-bulk" class="tab" onclick="switchTab('bulk')">
                <i class="fas fa-layer-group"></i> Bulk Search
            </button>
        </div>

        <!-- Single Search Panel -->
        <div id="panel-single">
            <div class="card">
                <form id="single-form" class="form-row">
                    <div class="form-group" style="flex:1; min-width:180px;">
                        <label>Phone Number</label>
                        <input type="text" id="single-phone" placeholder="0XXXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label>Data (GB)</label>
                        <input type="number" id="single-gb" placeholder="Optional" step="any" style="min-width:120px;">
                    </div>
                    <button type="submit" id="single-btn" class="btn btn-primary">
                        <i class="fas fa-search"></i> Search
                    </button>
                </form>
            </div>
            <div id="single-results"></div>
        </div>

        <!-- Bulk Search Panel -->
        <div id="panel-bulk" class="hidden">
            <div class="card">
                <form id="bulk-form">
                    <div class="form-group" style="margin-bottom:12px;">
                        <label>Phone Numbers <span class="count-badge" id="phone-count">0 numbers</span></label>
                        <textarea id="bulk-phones" rows="6" placeholder="number  GB (per line):&#10;0241234567&#9;4&#10;0551234567&#9;2&#10;0201234567&#9;8&#10;0546112120&#9;25"></textarea>
                        <span style="font-size:11px; color:var(--text-dim); margin-top:2px;">Tab or space between number and GB. GB is optional per line.</span>
                    </div>
                    <div class="form-row" style="margin-bottom:12px;">
                        <div class="form-group">
                            <label>From Date</label>
                            <input type="date" id="bulk-date-from" style="min-width:150px;">
                        </div>
                        <div class="form-group">
                            <label>To Date</label>
                            <input type="date" id="bulk-date-to" style="min-width:150px;">
                        </div>
                    </div>
                    <div class="form-row">
                        <button type="submit" id="bulk-btn" class="btn btn-primary">
                            <i class="fas fa-layer-group"></i> Bulk Search
                        </button>
                        <button type="button" id="export-btn" class="btn btn-outline hidden" onclick="exportCSV()">
                            <i class="fas fa-download"></i> Export CSV
                        </button>
                        <button type="button" id="clear-btn" class="btn btn-danger" onclick="clearBulk()">
                            <i class="fas fa-times"></i> Clear
                        </button>
                    </div>
                    <div class="progress-bar" id="bulk-progress">
                        <div class="track"><div class="fill" id="progress-fill" style="width:0%"></div></div>
                        <p class="label" id="progress-label">Searching...</p>
                    </div>
                </form>
            </div>
            <div id="bulk-results"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toast-msg"></span></div>

    <script>
        const API_BASE = window.location.origin + '/api/lookup';
        let lastBulkData = null;

        /* ---- Theme toggle ---- */
        (function initTheme() {
            var saved = localStorage.getItem('lookup-theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
            updateThemeIcon();
        })();

        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'light' ? 'dark' : 'light';
            if (next === 'dark') {
                document.documentElement.removeAttribute('data-theme');
            } else {
                document.documentElement.setAttribute('data-theme', next);
            }
            localStorage.setItem('lookup-theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            var btn = document.getElementById('theme-toggle');
            if (!btn) return;
            var isLight = document.documentElement.getAttribute('data-theme') === 'light';
            btn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            btn.title = isLight ? 'Switch to dark mode' : 'Switch to light mode';
        }

        function fmtDate(d) {
            if (!d) return '-';
            return new Date(d).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function toLocal(msisdn) {
            if (msisdn && msisdn.startsWith('233') && msisdn.length === 12) return '0' + msisdn.slice(3);
            return msisdn || '-';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function switchTab(tab) {
            document.getElementById('panel-single').classList.toggle('hidden', tab !== 'single');
            document.getElementById('panel-bulk').classList.toggle('hidden', tab !== 'bulk');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
        }

        function badge(status) {
            const map = {
                success: { cls: 'badge-success', label: 'Success' },
                failed:  { cls: 'badge-failed',  label: 'Failed' },
                pending: { cls: 'badge-pending', label: 'Pending' }
            };
            const b = map[status] || { cls: 'badge-pending', label: status };
            return '<span class="badge ' + b.cls + '"><i class="fas fa-circle"></i> ' + b.label + '</span>';
        }

        // Parse bulk lines: "number\tGB" or "number GB" or just "number"
        function parseBulkLines(raw) {
            return raw.split(/[\n,]+/).map(line => {
                line = line.trim();
                if (!line) return null;
                const parts = line.split(/[\t\s]+/);
                const phone = parts[0];
                const gb = parts[1] ? parseFloat(parts[1]) : null;
                return { phone, gb: (gb && !isNaN(gb)) ? gb : null };
            }).filter(Boolean);
        }

        // Live phone count
        document.getElementById('bulk-phones').addEventListener('input', function() {
            const entries = parseBulkLines(this.value);
            document.getElementById('phone-count').textContent = entries.length + ' number' + (entries.length !== 1 ? 's' : '');
        });

        function renderTable(records, animate) {
            if (!records || records.length === 0) {
                return '<div class="table-wrap"><div class="empty-state"><i class="fas fa-inbox"></i><p>No records found</p></div></div>';
            }

            let html = '<div class="table-wrap ' + (animate ? 'animate-in' : '') + '">';
            html += '<table class="desktop-table"><thead><tr>';
            html += '<th>MSISDN</th><th>Status</th><th>Data</th><th>Name</th><th>Fail Reason</th><th>Imported</th>';
            html += '</tr></thead><tbody>';

            records.forEach(r => {
                html += '<tr>';
                html += '<td class="cell-phone">' + toLocal(r.msisdn) + '</td>';
                html += '<td>' + badge(r.source) + '</td>';
                html += '<td class="cell-gb">' + (r.data_gb ? r.data_gb.toFixed(2) + ' GB' : '-') + '</td>';
                html += '<td>' + (r.beneficiary_name || '<span style="color:var(--text-dim)">\u2014</span>') + '</td>';
                html += '<td>' + (r.failed_reason || '<span style="color:var(--text-dim)">\u2014</span>') + '</td>';
                html += '<td>' + fmtDate(r.imported_at) + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table>';

            // Mobile cards
            html += '<div class="mobile-cards">';
            records.forEach(r => {
                html += '<div class="mobile-card">';
                html += '<div class="mobile-row"><span class="mlabel">MSISDN</span><span class="mvalue cell-phone">' + toLocal(r.msisdn) + '</span></div>';
                html += '<div class="mobile-row"><span class="mlabel">Status</span><span class="mvalue">' + badge(r.source) + '</span></div>';
                html += '<div class="mobile-row"><span class="mlabel">Data</span><span class="mvalue cell-gb">' + (r.data_gb ? r.data_gb.toFixed(2) + ' GB' : '-') + '</span></div>';
                html += '<div class="mobile-row"><span class="mlabel">Name</span><span class="mvalue">' + (r.beneficiary_name || '\u2014') + '</span></div>';
                html += '<div class="mobile-row"><span class="mlabel">Fail Reason</span><span class="mvalue">' + (r.failed_reason || '\u2014') + '</span></div>';
                html += '<div class="mobile-row"><span class="mlabel">Imported</span><span class="mvalue">' + fmtDate(r.imported_at) + '</span></div>';
                html += '</div>';
            });
            html += '</div></div>';

            return html;
        }

        // Single search
        document.getElementById('single-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('single-phone').value.trim();
            const gb = document.getElementById('single-gb').value;
            const btn = document.getElementById('single-btn');
            const container = document.getElementById('single-results');

            if (!phone) return;

            btn.disabled = true;
            btn.innerHTML = '<div class="loader" style="width:16px;height:16px;border-width:2px;"></div> Searching...';
            container.innerHTML = '<div class="loading"><div class="loader"></div></div>';

            try {
                const res = await fetch(API_BASE + '/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, dataGb: gb || undefined })
                });
                const json = await res.json();

                if (!json.success) {
                    container.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> ' + json.error + '</div>';
                    return;
                }

                const total = json.pagination?.total ?? json.data?.length ?? 0;
                let html = '<div class="stats animate-in"><div class="stat yellow"><div class="stat-label">Records Found</div><div class="stat-value">' + total + '</div></div></div>';
                html += renderTable(json.data, true);
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> ' + err.message + '</div>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search"></i> Search';
            }
        });

        // Bulk search
        document.getElementById('bulk-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phonesRaw = document.getElementById('bulk-phones').value.trim();
            const btn = document.getElementById('bulk-btn');
            const container = document.getElementById('bulk-results');
            const exportBtn = document.getElementById('export-btn');
            const progressBar = document.getElementById('bulk-progress');
            const progressFill = document.getElementById('progress-fill');
            const progressLabel = document.getElementById('progress-label');

            if (!phonesRaw) return;

            const entries = parseBulkLines(phonesRaw);
            if (entries.length === 0) return;
            if (entries.length > 200) {
                container.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> Maximum 200 numbers per search</div>';
                return;
            }

            // Build a map of phone->gb from input for display
            const gbMap = {};
            entries.forEach(e => { if (e.gb) gbMap[e.phone] = e.gb; });

            // Date filters
            const dateFrom = document.getElementById('bulk-date-from').value;
            const dateTo = document.getElementById('bulk-date-to').value;

            btn.disabled = true;
            btn.innerHTML = '<div class="loader" style="width:16px;height:16px;border-width:2px;"></div> Searching...';
            exportBtn.classList.add('hidden');
            progressBar.style.display = 'block';
            progressFill.style.width = '10%';
            progressLabel.textContent = 'Searching ' + entries.length + ' number(s)...';
            container.innerHTML = '<div class="loading"><div class="loader"></div></div>';

            try {
                progressFill.style.width = '40%';
                const res = await fetch(API_BASE + '/bulk-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phones: entries })
                });
                progressFill.style.width = '80%';
                const json = await res.json();
                progressFill.style.width = '100%';

                if (!json.success) {
                    container.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> ' + json.error + '</div>';
                    return;
                }

                lastBulkData = json.results;

                // Apply date filter to each result's records
                json.results.forEach(r => {
                    if (r.success && r.records) {
                        r.records = filterByDate(r.records, dateFrom, dateTo);
                    }
                });

                let totalRecords = 0, withRecords = 0, noRecords = 0, errors = 0;
                json.results.forEach(r => {
                    if (!r.success) { errors++; return; }
                    if (r.records.length > 0) { withRecords++; totalRecords += r.records.length; }
                    else noRecords++;
                });

                let html = '<div class="stats animate-in">';
                html += '<div class="stat yellow"><div class="stat-label">Searched</div><div class="stat-value">' + entries.length + '</div></div>';
                html += '<div class="stat green"><div class="stat-label">With Records</div><div class="stat-value">' + withRecords + '</div></div>';
                html += '<div class="stat blue"><div class="stat-label">Total Records</div><div class="stat-value">' + totalRecords + '</div></div>';
                html += '<div class="stat red"><div class="stat-label">Errors</div><div class="stat-value">' + errors + '</div></div>';
                html += '</div>';

                // Per-number cards (numbered, always open, screenshot-friendly)
                json.results.forEach((r, idx) => {
                    const localPhone = r.phone;
                    const count = r.success ? r.records.length : 0;
                    const isErr = !r.success;
                    const countCls = isErr ? 'err' : (count > 0 ? 'ok' : 'none');
                    const countLabel = isErr ? 'Error' : count + ' record' + (count !== 1 ? 's' : '');

                    html += '<div class="num-card' + (isErr ? ' has-error' : '') + '">';
                    html += '<div class="num-title">';
                    html += '<span class="num-index">' + (idx + 1) + '.</span>';
                    html += '<span class="num-phone">' + localPhone + '</span>';
                    html += '<span class="num-count ' + countCls + '">' + countLabel + '</span>';
                    html += '</div>';

                    if (isErr) {
                        html += '<div class="num-error"><i class="fas fa-exclamation-circle"></i> ' + r.error + '</div>';
                    } else if (count === 0) {
                        html += '<div class="num-empty">No records found</div>';
                    } else {
                        html += '<div class="num-records">';
                        html += '<table class="num-table"><thead><tr>';
                        html += '<th>Date</th><th>Number</th><th>Data</th><th>Status</th>';
                        html += '</tr></thead><tbody>';
                        r.records.forEach(rec => {
                            html += '<tr>';
                            html += '<td>' + fmtDate(rec.imported_at) + '</td>';
                            html += '<td>' + toLocal(rec.msisdn) + '</td>';
                            html += '<td class="gb">' + (rec.data_gb ? rec.data_gb.toFixed(2) + ' GB' : '-') + '</td>';
                            html += '<td>' + badge(rec.source) + '</td>';
                            html += '</tr>';
                        });
                        html += '</tbody></table>';
                        html += '</div>';
                    }

                    html += '</div>';
                });

                container.innerHTML = html;
                if (totalRecords > 0) {
                    exportBtn.classList.remove('hidden');
                    showToast('Found ' + totalRecords + ' records across ' + withRecords + ' numbers');
                }
            } catch (err) {
                container.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> ' + err.message + '</div>';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-layer-group"></i> Bulk Search';
                setTimeout(function() { progressBar.style.display = 'none'; }, 500);
            }
        });

        function clearBulk() {
            document.getElementById('bulk-phones').value = '';
            document.getElementById('bulk-date-from').value = '';
            document.getElementById('bulk-date-to').value = '';
            document.getElementById('bulk-results').innerHTML = '';
            document.getElementById('export-btn').classList.add('hidden');
            document.getElementById('phone-count').textContent = '0 numbers';
            lastBulkData = null;
        }

        function filterByDate(records, fromDate, toDate) {
            if (!fromDate && !toDate) return records;
            return records.filter(r => {
                if (!r.imported_at) return false;
                const d = new Date(r.imported_at).toISOString().slice(0, 10);
                if (fromDate && d < fromDate) return false;
                if (toDate && d > toDate) return false;
                return true;
            });
        }

        function exportCSV() {
            if (!lastBulkData) return;

            const rows = [['MSISDN', 'Source', 'Data GB', 'Name', 'Fail Reason', 'Imported']];
            lastBulkData.forEach(r => {
                if (r.records) {
                    r.records.forEach(rec => {
                        rows.push([
                            toLocal(rec.msisdn),
                            rec.source || '',
                            rec.data_gb ? rec.data_gb.toFixed(2) : '',
                            rec.beneficiary_name || '',
                            rec.failed_reason || '',
                            rec.imported_at || ''
                        ]);
                    });
                }
            });

            const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'lookup_results_' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            showToast('CSV exported successfully');
        }
    </script>
</body>
</html>
