<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Btopup GH - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <script src="../assets/js/config.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mtn-yellow': '#F5C518',
                        'dark-bg': '#1a1a2e',
                        'card-bg': '#16213e',
                        'airtel-red': '#E4002B',
                        'telecel-red': '#E53935',
                    }
                }
            }
        }
    </script>
    <style>
        .auth-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            position: relative;
            overflow: hidden;
        }
        .auth-bg::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            animation: pulse 15s ease-in-out infinite;
        }
        .auth-bg::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -20%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(245, 197, 24, 0.08) 0%, transparent 60%);
            animation: pulse 20s ease-in-out infinite reverse;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(22, 33, 62, 0.9) 0%, rgba(26, 26, 46, 0.95) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.03),
                transparent
            );
            animation: shimmer 3s ease-in-out infinite;
        }
        .glass-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3), transparent 40%, transparent 60%, rgba(245, 197, 24, 0.2));
            border-radius: 1rem;
            z-index: -1;
            opacity: 0.5;
        }
        @keyframes shimmer {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        .card-inner {
            position: relative;
            z-index: 1;
        }
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2), 0 0 20px rgba(59, 130, 246, 0.1);
        }
        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s ease-in-out infinite;
        }
        .shape-1 {
            top: 10%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6);
            animation-delay: 0s;
        }
        .shape-2 {
            top: 60%;
            right: 10%;
            width: 200px;
            height: 200px;
            background: linear-gradient(45deg, #f5c518, #f59e0b);
            animation-delay: -5s;
        }
        .shape-3 {
            bottom: 10%;
            left: 20%;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, #10b981, #06b6d4);
            animation-delay: -10s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(10px) rotate(-5deg); }
        }
        .grid-pattern {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>
</head>
<body class="auth-bg min-h-screen flex flex-col">
    <!-- Background Decorations -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    <div class="grid-pattern"></div>
    <!-- Header Navigation -->
    <header class="bg-card-bg py-3 sticky top-0 z-30">
        <div class="max-w-[1200px] mx-auto px-4 md:px-6 flex items-center justify-center">
            <a href="#" class="flex items-center gap-2">
                <i class="fas fa-bolt text-mtn-yellow text-xl"></i>
                <span class="text-white font-bold text-lg">Btopup GH</span>
                <span class="text-gray-400 text-xs hidden sm:inline">data portal</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md">
            <!-- Login Card -->
            <div class="glass-card rounded-2xl border border-gray-700/30 relative z-10">
                <div class="card-inner p-6 md:p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full mb-4">
                        <i class="fas fa-user text-white text-2xl"></i>
                    </div>
                    <h1 class="text-white text-2xl font-bold mb-2">Welcome Back</h1>
                    <p class="text-gray-400 text-sm">Sign in to your account to continue</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <!-- Email/Phone -->
                    <div>
                        <label class="text-gray-400 text-sm mb-2 block">Email or Phone Number</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="text" name="emailOrPhone" placeholder="Enter your email or phone" class="w-full bg-gray-800 text-white py-3 pl-12 pr-4 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm" required>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label class="text-gray-400 text-sm mb-2 block">Password</label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" id="password" placeholder="Enter your password" class="w-full bg-gray-800 text-white py-3 pl-12 pr-12 rounded-lg border border-gray-700 focus:outline-none focus:border-blue-500 transition text-sm" required>
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300 transition">
                                <i class="fas fa-eye" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" name="rememberMe" class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-blue-600 focus:ring-blue-500 focus:ring-offset-0">
                            <span class="text-gray-400 text-sm">Remember me</span>
                        </label>
                        <a href="#" class="text-blue-400 hover:text-blue-300 text-sm transition">Forgot password?</a>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">
                    <div class="flex-1 h-px bg-gray-700"></div>
                    <span class="text-gray-500 text-sm">or continue with</span>
                    <div class="flex-1 h-px bg-gray-700"></div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-lg transition border border-gray-700">
                        <i class="fab fa-google text-red-500"></i>
                        <span class="text-sm">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-3 rounded-lg transition border border-gray-700">
                        <i class="fab fa-facebook text-blue-500"></i>
                        <span class="text-sm">Facebook</span>
                    </button>
                </div>

                <!-- Sign Up Link -->
                <p class="text-center text-gray-400 text-sm mt-6">
                    Don't have an account? 
                    <a href="register.html" class="text-blue-400 hover:text-blue-300 font-medium transition">Create one</a>
                </p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-card-bg py-4 border-t border-gray-700">
        <div class="max-w-[1200px] mx-auto px-4 text-center">
            <p class="text-gray-500 text-sm">&copy; 2026 Btopup GH. All rights reserved.</p>
        </div>
    </footer>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
    
    <!-- JavaScript Modules -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/cart.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
